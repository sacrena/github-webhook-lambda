AWSTemplateFormatVersion: '2010-09-09'
Description: Shared authentication secrets for GitHub webhooks and the provisioning API connection.

Parameters:
  ProvisionApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Shared API key sent by the EventBridge connection to Lambda.
  GitHubWebhookSecretValue:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Secret GitHub uses to sign webhook deliveries.

Resources:
  ProvisionApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Shared API key for EventBridge provisioning deliveries.
      KmsKeyId: alias/aws/secretsmanager
      SecretString: !Ref ProvisionApiKeyValue

  GitHubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: agentic-setup-github-webhook-secret
      Description: Shared secret used to validate incoming GitHub webhooks.
      KmsKeyId: alias/aws/secretsmanager
      SecretString: !Ref GitHubWebhookSecretValue
      Tags:
        - Key: Name
          Value: agentic-setup-github-webhook-secret

Outputs:
  ProvisionApiKeyArn:
    Description: Shared API key ARN for Lambda and the EventBridge connection.
    Value: !Ref ProvisionApiKey
  GitHubWebhookSecretArn:
    Description: GitHub webhook secret ARN for Lambda authentication.
    Value: !Ref GitHubWebhookSecret
