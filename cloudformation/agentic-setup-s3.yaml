AWSTemplateFormatVersion: '2010-09-09'
Description: Private versioned S3 bucket for Lambda deployment artifacts.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: agentic-setup-code-bucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: lambda-artifacts

Outputs:
  ArtifactBucketName:
    Description: Bucket name for Lambda ZIP artifacts.
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Description: ARN of the artifact bucket.
    Value: !GetAtt ArtifactBucket.Arn
