<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
<title id="title">From GitHub event to coding job</title>
<desc id="desc">Proposed design, not deployed behavior. Accept a deliberate request, save its instructions, and start only one worker. A valid signature proves delivery origin. It does not authorize every comment author.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ff4d00" stroke-width="2"/></marker>
<style>text{font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;fill:#fff}.title{font-size:32px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:15px}.note{font-size:15px}.accent{fill:#ff4d00}.box{fill:#1a1a1a;stroke:#fff;stroke-width:2;stroke-linejoin:round}.arrow{fill:none;stroke:#ff4d00;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1440" fill="#1a1a1a"/>
<text x="60" y="60" class="title">From GitHub event to coding job</text>
<text x="60" y="96" class="body">Accept a deliberate request, save its instructions, and start only one worker.</text>
<text x="60" y="135" class="note accent">PROPOSED DESIGN • Kotlin script + fresh EC2 + Ansible</text>
<g id="step-0" data-box="550,180,500,140">
<path class="box" d="M550 180 Q800 178 1050 180 L1050 320 Q800 322 550 320 Z"/>
<text x="574" y="222" class="heading">1. A person requests a coding job</text>
<text x="574" y="252" class="body">Example: /agent fix the failing test</text>
<text x="574" y="278" class="body">GitHub sends the subscribed event.</text></g>
<g id="step-1" data-box="550,390,500,140">
<path class="box" d="M550 390 Q800 388 1050 390 L1050 530 Q800 532 550 530 Z"/>
<text x="574" y="432" class="heading">2. Check the request</text>
<text x="574" y="462" class="body">Verify the signature and allowed actor.</text>
<text x="574" y="488" class="body">Check repository, action and delivery ID.</text></g>
<g id="step-2" data-box="550,600,500,140">
<path class="box" d="M550 600 Q800 598 1050 600 L1050 740 Q800 742 550 740 Z"/>
<text x="574" y="642" class="heading">3. Save one job definition</text>
<text x="574" y="672" class="body">Save instructions, commit and deadline.</text>
<text x="574" y="698" class="body">Acknowledge receipt; reuse repeated deliveries.</text></g>
<g id="step-3" data-box="550,810,500,140">
<path class="box" d="M550 810 Q800 808 1050 810 L1050 950 Q800 952 550 950 Z"/>
<text x="574" y="852" class="heading">4. Reserve a worker slot</text>
<text x="574" y="882" class="body">Save the job and launch progress.</text>
<text x="574" y="908" class="body">At capacity, keep the job waiting.</text></g>
<g id="step-4" data-box="550,1020,500,140">
<path class="box" d="M550 1020 Q800 1018 1050 1020 L1050 1160 Q800 1162 550 1160 Z"/>
<text x="574" y="1062" class="heading">5. Hand off to provisioning</text>
<text x="574" y="1092" class="body">Record the assigned instance ID.</text>
<text x="574" y="1118" class="body">The worker now prepares to run the job.</text></g>
<g id="alternate" data-box="1170,390,370,140">
<path class="box" d="M1170 390 Q1355 388 1540 390 L1540 530 Q1355 532 1170 530 Z"/>
<text x="1194" y="432" class="heading">Request not allowed</text>
<text x="1194" y="462" class="body">Reject or ignore it.</text>
<text x="1194" y="488" class="body">Do not launch a worker.</text></g>
<path class="arrow" d="M800 320V390"/>
<path class="arrow" d="M800 530V600"/>
<path class="arrow" d="M800 740V810"/>
<path class="arrow" d="M800 950V1020"/>
<path class="arrow" d="M1050 460H1170"/>
<text x="1080" y="442" class="note">invalid</text>
<path class="arrow" d="M60 1260H125"/><text x="145" y="1265" class="note">Next step or labeled alternate path</text>
<text x="60" y="1320" class="note">A valid signature proves delivery origin. It does not authorize every comment author.</text>
<a href="README.md"><text x="60" y="1370" class="note accent">Read the companion guide: README.md</text></a>
