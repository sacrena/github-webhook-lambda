<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
<title id="title">The Kotlin job runner</title>
<desc id="desc">Proposed design, not deployed behavior. One script fetches code, runs the coding task, and publishes a reviewable result. This runner is your Kotlin script. It does not register as a GitHub Actions runner.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ff4d00" stroke-width="2"/></marker>
<style>text{font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;fill:#fff}.title{font-size:32px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:15px}.note{font-size:15px}.accent{fill:#ff4d00}.box{fill:#1a1a1a;stroke:#fff;stroke-width:2;stroke-linejoin:round}.arrow{fill:none;stroke:#ff4d00;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1440" fill="#1a1a1a"/>
<text x="60" y="60" class="title">The Kotlin job runner</text>
<text x="60" y="96" class="body">One script fetches code, runs the coding task, and publishes a reviewable result.</text>
<text x="60" y="135" class="note accent">PROPOSED DESIGN • Kotlin script + fresh EC2 + Ansible</text>
<g id="step-0" data-box="550,180,500,140">
<path class="box" d="M550 180 Q800 178 1050 180 L1050 320 Q800 322 550 320 Z"/>
<text x="574" y="222" class="heading">1. Claim job and prepare credentials</text>
<text x="574" y="252" class="body">Load approved instructions and source commit.</text>
<text x="574" y="278" class="body">Fetch issue or PR context when needed.</text></g>
<g id="step-1" data-box="550,390,500,140">
<path class="box" d="M550 390 Q800 388 1050 390 L1050 530 Q800 532 550 530 Z"/>
<text x="574" y="432" class="heading">2. Fetch code into a new work folder</text>
<text x="574" y="462" class="body">Check out the recorded starting commit.</text>
<text x="574" y="488" class="body">Create the assigned output branch.</text></g>
<g id="step-2" data-box="550,600,500,140">
<path class="box" d="M550 600 Q800 598 1050 600 L1050 740 Q800 742 550 740 Z"/>
<text x="574" y="642" class="heading">3. Run agent and project checks</text>
<text x="574" y="672" class="body">Give the agent the task and context.</text>
<text x="574" y="698" class="body">Capture command results and test output.</text></g>
<g id="step-3" data-box="550,810,500,140">
<path class="box" d="M550 810 Q800 808 1050 810 L1050 950 Q800 952 550 950 Z"/>
<text x="574" y="852" class="heading">4. Review and publish the changes</text>
<text x="574" y="882" class="body">Check the diff; commit and push the branch.</text>
<text x="574" y="908" class="body">Open a PR using the drafted description.</text></g>
<g id="step-4" data-box="550,1020,500,140">
<path class="box" d="M550 1020 Q800 1018 1050 1020 L1050 1160 Q800 1162 550 1160 Z"/>
<text x="574" y="1062" class="heading">5. Save the result and finish</text>
<text x="574" y="1092" class="body">Store logs, commit and any PR link.</text>
<text x="574" y="1118" class="body">Report completion for EC2 cleanup.</text></g>
<g id="alternate" data-box="1170,600,370,140">
<path class="box" d="M1170 600 Q1355 598 1540 600 L1540 740 Q1355 742 1170 740 Z"/>
<text x="1194" y="642" class="heading">Failure or no changes</text>
<text x="1194" y="672" class="body">Save a clear outcome.</text>
<text x="1194" y="698" class="body">Continue to cleanup, not push.</text></g>
<path class="arrow" d="M800 320V390"/>
<path class="arrow" d="M800 530V600"/>
<path class="arrow" d="M800 740V810"/>
<path class="arrow" d="M800 950V1020"/>
<path class="arrow" d="M1050 670H1170"/>
<path class="arrow" d="M1540 670H1560V1090H1050"/>
<text x="1080" y="652" class="note">stop</text>
<path class="arrow" d="M60 1260H125"/><text x="145" y="1265" class="note">Next step or labeled alternate path</text>
<text x="60" y="1320" class="note">This runner is your Kotlin script. It does not register as a GitHub Actions runner.</text>
<a href="README.md"><text x="60" y="1370" class="note accent">Read the companion guide: README.md</text></a>
